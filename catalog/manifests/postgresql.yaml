id: postgresql
name: PostgreSQL
description: Banco de dados relacional PostgreSQL para experimentos e aplicações do laboratório.
category: banco-de-dados
manifest_version: 1
supported:
  debian: "*"
  ubuntu: "*"
  alpine: "*"
detect_command_id: postgresql
verify_command_id: postgresql
documentation: https://www.postgresql.org/docs/
requires_admin: true
icon: database
install_plan:
  debian:
    - action: apt_update
      description: Atualizar o índice local de pacotes APT.
    - action: apt_install
      packages: [postgresql, postgresql-contrib]
      description: Instalar PostgreSQL e extensões adicionais fornecidas pela distribuição.
    - action: systemd_enable
      service: postgresql
      description: Habilitar e iniciar PostgreSQL.
  ubuntu:
    - action: apt_update
      description: Atualizar o índice local de pacotes APT.
    - action: apt_install
      packages: [postgresql, postgresql-contrib]
      description: Instalar PostgreSQL e extensões adicionais fornecidas pela distribuição.
    - action: systemd_enable
      service: postgresql
      description: Habilitar e iniciar PostgreSQL.
  alpine:
    - action: apk_add
      packages: [postgresql, postgresql-contrib]
      description: Instalar PostgreSQL e contribuições com APK.
