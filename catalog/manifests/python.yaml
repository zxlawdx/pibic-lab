id: python
name: Python 3
description: Runtime Python 3 e gerenciador pip para ambientes de desenvolvimento e pesquisa.
category: desenvolvimento
manifest_version: 1
supported:
  debian: "*"
  ubuntu: "*"
  alpine: "*"
detect_command_id: python
verify_command_id: python
documentation: https://docs.python.org/3/
requires_admin: true
icon: code
install_plan:
  debian:
    - action: apt_update
      description: Atualizar o índice local de pacotes APT.
    - action: apt_install
      packages: [python3, python3-pip, python3-venv]
      description: Instalar Python 3, pip e suporte a ambientes virtuais.
  ubuntu:
    - action: apt_update
      description: Atualizar o índice local de pacotes APT.
    - action: apt_install
      packages: [python3, python3-pip, python3-venv]
      description: Instalar Python 3, pip e suporte a ambientes virtuais.
  alpine:
    - action: apk_add
      packages: [python3, py3-pip]
      description: Instalar Python 3 e pip com APK.
