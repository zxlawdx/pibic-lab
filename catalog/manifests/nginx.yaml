id: nginx
name: Nginx
description: Servidor web e proxy reverso para serviços internos autorizados.
category: web
manifest_version: 1
supported:
  debian: "*"
  ubuntu: "*"
  alpine: "*"
detect_command_id: nginx
verify_command_id: nginx
documentation: https://nginx.org/en/docs/
requires_admin: true
icon: server
install_plan:
  debian:
    - action: apt_update
      description: Atualizar o índice local de pacotes APT.
    - action: apt_install
      packages: [nginx]
      description: Instalar Nginx pelo repositório da distribuição.
    - action: systemd_enable
      service: nginx
      description: Habilitar e iniciar o serviço Nginx.
  ubuntu:
    - action: apt_update
      description: Atualizar o índice local de pacotes APT.
    - action: apt_install
      packages: [nginx]
      description: Instalar Nginx pelo repositório da distribuição.
    - action: systemd_enable
      service: nginx
      description: Habilitar e iniciar o serviço Nginx.
  alpine:
    - action: apk_add
      packages: [nginx]
      description: Instalar Nginx com APK.
    - action: openrc_enable
      service: nginx
      description: Adicionar Nginx ao OpenRC e iniciar o serviço.
