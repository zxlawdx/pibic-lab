id: docker
name: Docker Engine
description: Runtime de containers para serviços isolados da VM. O app não adiciona usuários ao grupo docker automaticamente.
category: containers
manifest_version: 1
supported:
  debian: "*"
  ubuntu: "*"
  alpine: "*"
detect_command_id: docker
verify_command_id: docker
documentation: https://docs.docker.com/
requires_admin: true
icon: boxes
install_plan:
  debian:
    - action: apt_update
      description: Atualizar o índice local de pacotes APT.
    - action: apt_install
      packages: [docker.io, docker-compose]
      description: Instalar Docker e Compose pelos pacotes da distribuição.
    - action: systemd_enable
      service: docker
      description: Habilitar e iniciar o daemon Docker.
  ubuntu:
    - action: apt_update
      description: Atualizar o índice local de pacotes APT.
    - action: apt_install
      packages: [docker.io, docker-compose]
      description: Instalar Docker e Compose pelos pacotes da distribuição.
    - action: systemd_enable
      service: docker
      description: Habilitar e iniciar o daemon Docker.
  alpine:
    - action: apk_add
      packages: [docker, docker-cli-compose]
      description: Instalar Docker e Compose com APK.
    - action: openrc_enable
      service: docker
      description: Adicionar Docker ao OpenRC e iniciar o daemon.
