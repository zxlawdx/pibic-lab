[project]
name = "pibic-lab"
version = "0.1.2"
description = "Cliente desktop Vela para acesso seguro às VMs do laboratório PIBIC"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
